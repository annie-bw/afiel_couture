<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      One address is written in several places below (canonical, og:url,
      og:image, and the JSON-LD), and again in public/sitemap.xml and
      public/robots.txt. If the site ever moves, change it in those three files
      and nowhere else.

      The business details here are duplicated from CONTACT in
      src/data/content.ts on purpose: search and social crawlers read this file
      as it is served, without running the app. Change one, change the other.
    -->
    <link rel="canonical" href="https://afielcouture.com/" />

    <title>Afiel Couture | Bespoke Tailoring and Uniforms in Kigali</title>
    <!-- This is the sentence Google prints under the link in its results. -->
    <meta
      name="description"
      content="Looking for custom tailoring in Kigali? Afiel Couture designs and tailors made-to-measure suits, dresses and uniforms with fabrics selected for your unique style."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1C1A17" />
    <meta name="author" content="Afiel Couture" />

    <!-- Shared links: WhatsApp, Facebook and X read these, and none of them run
         JavaScript, so the card has to be static markup. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Afiel Couture" />
    <meta property="og:title" content="Afiel Couture | Bespoke Tailoring and Uniforms in Kigali" />
    <meta
      property="og:description"
      content="Looking for custom tailoring in Kigali? Afiel Couture designs and tailors made-to-measure suits, dresses and uniforms with fabrics selected for your unique style."
    />
    <meta property="og:url" content="https://afielcouture.com/" />
    <meta property="og:image" content="https://afielcouture.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Afiel Couture: a model in a black and gold couture gown" />
    <meta property="og:locale" content="en_RW" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Afiel Couture | Bespoke Tailoring and Uniforms in Kigali" />
    <meta
      name="twitter:description"
      content="Looking for custom tailoring in Kigali? Afiel Couture designs and tailors made-to-measure suits, dresses and uniforms with fabrics selected for your unique style."
    />
    <meta name="twitter:image" content="https://afielcouture.com/og-image.jpg" />

    <!-- The hero figure, started before the JavaScript that renders it. Every
         image on the page lives inside a React component, so without this line
         the browser cannot know the hero exists until roughly 175 KB of script
         has downloaded and run, and the hero area sits empty until then. -->
    <link rel="preload" as="image" href="/images/home/hero-figure.webp" fetchpriority="high" />

    <link rel="icon" href="/images/logo-dark.png" />
    <link rel="apple-touch-icon" href="/images/logo-dark.png" />

    <!--
      One connected graph rather than a single business entry, because Google
      reads these as facts about different things:

        Organization   the business, and every name people might search it by.
                       alternateName is the part that matters for a brand nobody
                       has heard of yet: it states that Afiel, AfielCouture and
                       Afiel Couture are one company.
        WebSite        ties this domain to that business as its publisher.
        ClothingStore  the shop itself: address, phone, hours, what it sells.
        ItemList       the main navigation, named and ordered. Sitelinks, the
                       indented sub-pages under a search result, are chosen by
                       Google and cannot be requested; a clearly named hierarchy
                       is the signal it uses to choose them.

      Details here duplicate CONTACT in src/data/content.ts on purpose: crawlers
      read this file as served, without running the app. Change one, change both.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://afielcouture.com/#organization",
            "name": "Afiel Couture",
            "alternateName": [
              "Afiel",
              "AfielCouture",
              "Afiel Couture Kigali",
              "Afiel Couture Rwanda",
              "Afriktexia"
            ],
            "legalName": "Afriktexia",
            "url": "https://afielcouture.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://afielcouture.com/images/logo-dark.png",
              "width": 424,
              "height": 134
            },
            "image": "https://afielcouture.com/og-image.jpg",
            "description": "Looking for custom tailoring in Kigali? Afiel Couture designs and tailors made-to-measure suits, dresses and uniforms with fabrics selected for your unique style.",
            "slogan": "Where Every Stitch Defines Elegance",
            "email": "afielcouture@gmail.com",
            "telephone": "+250796690256",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "KG 7 St, Rindiro, Kibagabaga",
              "addressLocality": "Kimironko, Gasabo",
              "addressRegion": "Kigali",
              "addressCountry": "RW"
            },
            "sameAs": [
              "https://www.instagram.com/afiel_couture",
              "https://www.tiktok.com/@afiel.couture"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://afielcouture.com/#website",
            "url": "https://afielcouture.com/",
            "name": "Afiel Couture",
            "alternateName": ["Afiel", "AfielCouture"],
            "description": "Looking for custom tailoring in Kigali? Afiel Couture designs and tailors made-to-measure suits, dresses and uniforms with fabrics selected for your unique style.",
            "publisher": { "@id": "https://afielcouture.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "ClothingStore",
            "@id": "https://afielcouture.com/#store",
            "name": "Afiel Couture",
            "parentOrganization": { "@id": "https://afielcouture.com/#organization" },
            "url": "https://afielcouture.com/",
            "image": "https://afielcouture.com/og-image.jpg",
            "telephone": "+250796690256",
            "email": "afielcouture@gmail.com",
            "currenciesAccepted": "RWF",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "KG 7 St, Rindiro, Kibagabaga",
              "addressLocality": "Kimironko, Gasabo",
              "addressRegion": "Kigali",
              "addressCountry": "RW"
            },
            "areaServed": { "@type": "Country", "name": "Rwanda" },
            "openingHoursSpecification": [
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": [
                  "Monday",
                  "Tuesday",
                  "Wednesday",
                  "Thursday",
                  "Friday",
                  "Saturday"
                ],
                "opens": "08:00",
                "closes": "18:00"
              }
            ],
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "sales",
                "telephone": "+250796690256",
                "email": "afielcouture@gmail.com",
                "areaServed": "RW",
                "availableLanguage": ["en", "rw", "fr"]
              },
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "telephone": "+250732108169",
                "email": "info@afielcouture.com",
                "areaServed": "RW"
              }
            ],
            "makesOffer": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bespoke tailoring" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Umushanana collection" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "School uniforms" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Corporate uniforms" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Fabric development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Alterations and repairs" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Fashion consultation" } }
            ]
          },
          {
            "@type": "ItemList",
            "@id": "https://afielcouture.com/#navigation",
            "name": "Afiel Couture navigation",
            "itemListElement": [
              {
                "@type": "SiteNavigationElement",
                "position": 1,
                "name": "Products",
                "description": "Bespoke tailoring, umushanana, school and corporate uniforms",
                "url": "https://afielcouture.com/products"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 2,
                "name": "Services",
                "description": "Fabric development, alterations and repairs, fashion consultation",
                "url": "https://afielcouture.com/services"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 3,
                "name": "Fabrics",
                "description": "The cloths we have in store",
                "url": "https://afielcouture.com/fabrics"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 4,
                "name": "About Us",
                "description": "More than 26 years in textiles and garments",
                "url": "https://afielcouture.com/about"
              },
              {
                "@type": "SiteNavigationElement",
                "position": 5,
                "name": "Contact",
                "description": "Visit, call or email the Kigali studio",
                "url": "https://afielcouture.com/contact"
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
